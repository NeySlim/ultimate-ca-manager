name: Tests & Quality Checks

on:
  push:
    branches: [main, master, develop, dev, test, 'v*', '*-dev', 'feature/**']
    # Prose-only commits do not need the suite (no required checks on any
    # branch), except the two files tests read.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'README.md'
      - 'docs/LOG_ROTATION.md'
  pull_request:
    branches: [main, master, develop, dev]
  workflow_dispatch:
    inputs:
      ha:
        description: 'Also run the three-node HA bench (backend/tests/ha)'
        type: boolean
        default: false
  schedule:
    # Nightly sequential run of dev (the default branch is main, see the job)
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

# A new push to a branch replaces the run of its previous commit, except on
# test and main, where every run is a release record, and on the 3.0 integration
# branch, where a push carries the FIPS build and a manual run the sequential job:
# one group per commit and event there, so a newer commit never cancels a run
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref_name == 'test' || github.ref_name == 'main' || github.ref_name == 'dev') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'test' && github.ref_name != 'main' && github.ref_name != 'dev' }}

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install ruff
        run: pip install ruff==0.17.5

      # Blocking: undefined names, bad star imports, syntax errors. The four
      # ignored codes are style debt tracked in backend/pyproject.toml.
      - name: Pyflakes gate (ruff)
        run: ruff check backend/ --select F --ignore F401,F541,F811,F841
  
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install bandit==1.9.4

      - name: Run Bandit security scan
        # Blocks on HIGH only; a deliberate use carries a justified `# nosec`
        run: bandit -r backend/ -lll
      
      - name: Run Trivy vulnerability scanner
        # Pinned to a release SHA: @master is a mutable ref, so a compromise of
        # the action's repo would execute attacker code in this workflow.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
  
  # Four parts of the file list balanced by measured duration (scripts/ci/shard-tests.sh), four workers each.
  test-backend:
    name: Backend Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install system dependencies
        run: scripts/ci/apt-install.sh libkrb5-dev
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          # As the packages do: pyjks without its twofish dependency
          pip install --no-deps pyjks==20.0.0
      
      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          UCM_ENV: test
          HTTP_REDIRECT: 'false'
          INITIAL_ADMIN_PASSWORD: changeme123
          CSRF_DISABLED: 'true'
          UCM_DEV_MODE: 'true'
        run: |
          cd backend
          # A failed or empty list stops the step: pytest without files runs the whole suite
          files=$(../scripts/ci/shard-tests.sh ${{ matrix.shard }} 4)
          [ -n "$files" ]
          pytest -v --tb=short -n 4 --dist loadfile $files

  # One database for the whole suite, as a user runs it: nightly and on demand;
  # no push run plays it.
  test-backend-sequential:
    name: Backend Tests (sequential)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 150
    # On the 3.0 integration branch one run at a time: the running one finishes, the
    # newest manual run waits and replaces any older waiting one; elsewhere one group per commit
    concurrency:
      group: tests-sequential-${{ github.event_name }}-${{ github.ref_name == 'dev' && github.ref || github.sha }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit of the run, not the branch tip a waiting job would find later
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: scripts/ci/apt-install.sh libkrb5-dev

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          # As the packages do: pyjks without its twofish dependency
          pip install --no-deps pyjks==20.0.0

      - name: Run tests
        id: deterministic
        env:
          SECRET_KEY: test-secret-key-for-ci
          UCM_ENV: test
          HTTP_REDIRECT: 'false'
          INITIAL_ADMIN_PASSWORD: changeme123
          CSRF_DISABLED: 'true'
          UCM_DEV_MODE: 'true'
        run: |
          cd backend
          # The tests marked slow (an hour of fault scenarios) stay with the shards: this job has a time limit
          pytest -v --tb=short --durations=30 -m "not ha and not slow"

      # The same suite in random order on the nightly run and on manual runs of the 3.0
      # integration branch: a report, not a gate. The job summary gives the seed that replays the order.
      - name: Run tests in random order (report only)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'dev')) && steps.deterministic.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          SECRET_KEY: test-secret-key-for-ci
          UCM_ENV: test
          HTTP_REDIRECT: 'false'
          INITIAL_ADMIN_PASSWORD: changeme123
          CSRF_DISABLED: 'true'
          UCM_DEV_MODE: 'true'
        run: |
          pip install pytest-randomly==5.0.0
          sha=$(git rev-parse HEAD)
          cd backend
          seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')
          set +e
          # Inside the step timeout, so a slow run still writes its summary (exit 124).
          timeout 40m pytest -p randomly --randomly-seed="$seed" -m "not ha and not slow" -q --tb=line -rfE > random-order.log 2>&1
          status=$?
          set -e
          tail -n 60 random-order.log
          {
            echo "### Random order: seed $seed, commit $sha, pytest exit $status"
            echo
            echo "Replay: \`git checkout $sha && pip install pytest-randomly==5.0.0 && cd backend && pytest -p randomly --randomly-seed=$seed -m 'not ha and not slow'\`"
            echo
            echo "Files with failures or errors:"
            echo
            grep -E '^(FAILED|ERROR) ' random-order.log | sed -E 's/^(FAILED|ERROR) ([^: ]+).*/\2/' | sort | uniq -c | sort -rn | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  test-backend-postgres:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucm
          POSTGRES_PASSWORD: ucm_ci_password
          POSTGRES_DB: ucm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: scripts/ci/apt-install.sh libkrb5-dev libpq-dev postgresql-client

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install --no-deps pyjks==20.0.0

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U ucm && break
            sleep 1
          done

      # The role the service creates is a superuser, and a superuser can
      # disable foreign keys during a migration. Every installation that runs
      # a managed PostgreSQL cannot, and the fallback that handles it went
      # unexercised for thirty releases. These tests get a role that is
      # deliberately ordinary, with a database of its own to reset.
      - name: Create the unprivileged role the migration tests need
        env:
          PGPASSWORD: ucm_ci_password
        run: |
          psql -h localhost -U ucm -d ucm_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ucm_migtest LOGIN PASSWORD 'ucm_migtest_ci' NOSUPERUSER;
          CREATE DATABASE ucm_migtest OWNER ucm_migtest;
          SQL

      - name: Run PostgreSQL-targeted tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          UCM_ENV: test
          HTTP_REDIRECT: 'false'
          INITIAL_ADMIN_PASSWORD: changeme123
          CSRF_DISABLED: 'true'
          UCM_DEV_MODE: 'true'
          # No DATABASE_URL here on purpose: these tests keep their own SQLite
          # instance and reach PostgreSQL through the two variables below, each
          # building its own engine. The application on PostgreSQL is the next
          # job, through UCM_TEST_APP_PG_URL.
          UCM_TEST_POSTGRES_URL: postgresql://ucm:ucm_ci_password@localhost:5432/ucm_test
          UCM_TEST_PG_URL: postgresql://ucm_migtest:ucm_migtest_ci@localhost:5432/ucm_migtest
        run: |
          cd backend
          # Anything marked `postgres` anywhere in the suite, so a test added
          # later is picked up without editing this file.
          pytest --tb=short -m postgres tests/
          # And the files whose PostgreSQL half is opt-in rather than marked:
          # a backup restored onto an installation that is not the source, the
          # references it has to resolve, the migration matrix in both
          # directions, a migration at scale, and the migration routes. Every
          # one of them is skipped without UCM_TEST_PG_URL, which is why this
          # job exists at all.
          pytest --tb=short \
            tests/test_backup_cross_installation.py \
            tests/test_restore_reference_resolution_pg.py \
            tests/test_database_migration_matrix.py \
            tests/test_database_migration_scale.py \
            tests/test_database_admin.py \
            tests/test_migration_runner_pg.py \
            tests/test_scep_intune_ca_lock_pg.py

  # The application suite on PostgreSQL, in three shards of scripts/ci/pg-app-tests.txt,
  # each with a PostgreSQL service of its own.
  test-backend-postgres-app:
    name: Backend Tests (PostgreSQL app ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucm
          POSTGRES_PASSWORD: ucm_ci_password
          POSTGRES_DB: ucm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: scripts/ci/apt-install.sh libkrb5-dev libpq-dev postgresql-client

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install --no-deps pyjks==20.0.0

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U ucm && break
            sleep 1
          done

      # The role the service creates is a superuser, and a superuser can
      # disable foreign keys during a migration. Every installation that runs
      # a managed PostgreSQL cannot, and the fallback that handles it went
      # unexercised for thirty releases. These tests get a role that is
      # deliberately ordinary, with a database of its own to reset.
      - name: Create the unprivileged role the migration tests need
        env:
          PGPASSWORD: ucm_ci_password
        run: |
          psql -h localhost -U ucm -d ucm_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ucm_migtest LOGIN PASSWORD 'ucm_migtest_ci' NOSUPERUSER;
          CREATE DATABASE ucm_migtest OWNER ucm_migtest;
          SQL

      # The application itself on PostgreSQL: the session `app` fixture builds
      # it in a schema of its own (docs/testing/postgres-harness.md), so the
      # routes and services run on this backend and not only the migrations.
      # The unprivileged role, as on a managed PostgreSQL; its `public` schema
      # is never touched here.
      - name: Run the application tests on PostgreSQL
        timeout-minutes: 30
        env:
          SECRET_KEY: test-secret-key-for-ci
          UCM_ENV: test
          HTTP_REDIRECT: 'false'
          INITIAL_ADMIN_PASSWORD: changeme123
          CSRF_DISABLED: 'true'
          UCM_DEV_MODE: 'true'
          UCM_TEST_APP_PG_URL: postgresql://ucm_migtest:ucm_migtest_ci@localhost:5432/ucm_migtest
        run: |
          cd backend
          files=$(../scripts/ci/shard-tests.sh ${{ matrix.shard }} 3 ../scripts/ci/pg-app-tests.txt)
          [ -n "$files" ]
          pytest --tb=short $files

  # The tests of a real SoftHSM token, of the system GSSAPI and of a Redis server, installed here.
  # Selected by marker; a skip of a marked test fails the job (tests/optional_backends.py).
  test-optional-backends:
    name: Backend Tests (SoftHSM, GSSAPI, Redis)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: scripts/ci/apt-install.sh libkrb5-dev softhsm2 redis-server

      # The tests start their own redis-server on a Unix socket: only the binary serves
      - name: Stop the system Redis service
        run: sudo systemctl stop redis-server

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install --no-deps pyjks==20.0.0
          # The Kerberos extra at the pyspnego version of the requirements, as the image does
          pip install "pyspnego[kerberos]==$(pip show pyspnego | sed -n 's/^Version: //p')"

      # Every token lives in the job's temporary directory, never in the system token store
      - name: Throwaway SoftHSM configuration
        run: |
          mkdir -p "${{ runner.temp }}/softhsm/tokens"
          printf '%s\n' 'directories.tokendir = ${{ runner.temp }}/softhsm/tokens' \
            'objectstore.backend = file' 'log.level = ERROR' > "${{ runner.temp }}/softhsm2.conf"

      - name: Run the SoftHSM tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          UCM_ENV: test
          HTTP_REDIRECT: 'false'
          INITIAL_ADMIN_PASSWORD: changeme123
          CSRF_DISABLED: 'true'
          UCM_DEV_MODE: 'true'
          SOFTHSM2_CONF: ${{ runner.temp }}/softhsm2.conf
          UCM_TEST_REQUIRE_SOFTHSM: '1'
        run: |
          cd backend
          pytest --tb=short -rs -m needs_softhsm tests/

      - name: Run the GSSAPI tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          UCM_ENV: test
          HTTP_REDIRECT: 'false'
          INITIAL_ADMIN_PASSWORD: changeme123
          CSRF_DISABLED: 'true'
          UCM_DEV_MODE: 'true'
          UCM_TEST_REQUIRE_GSSAPI: '1'
        run: |
          cd backend
          pytest --tb=short -rs -m needs_gssapi tests/

      - name: Run the Redis tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          UCM_ENV: test
          HTTP_REDIRECT: 'false'
          INITIAL_ADMIN_PASSWORD: changeme123
          CSRF_DISABLED: 'true'
          UCM_DEV_MODE: 'true'
          UCM_TEST_REQUIRE_REDIS: '1'
        run: |
          cd backend
          pytest --tb=short -rs -m needs_redis tests/

  # Real UCM nodes (two, then three) in HA mode on one PostgreSQL (docs/testing/ha-bench.md).
  # Manual only: run the workflow by hand with the `ha` input ticked. In shards
  # (scripts/ci/ha-bench-shard.sh): the whole bench in one job outlasts the time limit.
  test-ha-bench:
    name: HA bench (three nodes, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.ha
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [crash-crl, jobs, restore, rest]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucm
          POSTGRES_PASSWORD: ucm_ci_password
          POSTGRES_DB: ucm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: scripts/ci/apt-install.sh libkrb5-dev libpq-dev postgresql-client

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install --no-deps pyjks==20.0.0

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U ucm && break
            sleep 1
          done

      - name: Create the unprivileged role the bench runs as
        env:
          PGPASSWORD: ucm_ci_password
        run: |
          psql -h localhost -U ucm -d ucm_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ucm_migtest LOGIN PASSWORD 'ucm_migtest_ci' NOSUPERUSER;
          CREATE DATABASE ucm_migtest OWNER ucm_migtest;
          SQL

      - name: Run the HA bench
        env:
          UCM_TEST_HA: '1'
          UCM_TEST_PG_URL: postgresql://ucm_migtest:ucm_migtest_ci@localhost:5432/ucm_migtest
        run: |
          cd backend
          # A failed or empty list stops the step: pytest without files runs the whole suite
          files=$(../scripts/ci/ha-bench-shard.sh ${{ matrix.shard }})
          [ -n "$files" ]
          pytest --tb=short -m ha $files

  # The pytest tests that call `helm template` are skipped without helm: they run here.
  test-helm:
    name: Helm chart
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.3

      - name: Lint and render the chart
        run: |
          helm lint charts/ucm
          helm template t charts/ucm > /dev/null
          HA="--set ha.enabled=true --set replicaCount=2 --set database.type=postgresql --set database.databaseUrl=postgresql://u:p@db/ucm --set secrets.keyEncryptionKey=K --set secrets.dbEncryptionKey=D --set secrets.secretKey=S"
          helm lint charts/ucm $HA
          helm template t charts/ucm $HA > /dev/null

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run the chart tests
        run: |
          cd backend
          pytest --tb=short -rs tests/test_helm_ha.py tests/test_helm_db_key.py tests/test_helm_security_context.py tests/test_helm_initial_admin_password.py tests/test_no_jwt_secret_generated.py tests/test_health_ha.py tests/test_compose_ha.py tests/test_entrypoint_ha_database.py

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run tests
        run: |
          cd frontend
          npm test -- --run

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Check the locale files are in sync
        run: |
          cd frontend
          npm run check:i18n
  
  # Playwright against a real instance: backend from this checkout, fresh SQLite, built
  # interface, all set up by scripts/ci/e2e.sh (the same script runs it locally).
  test-e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/test'))
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: scripts/ci/apt-install.sh libkrb5-dev

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install --no-deps pyjks==20.0.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install the browser's system libraries
        run: |
          cd frontend
          npx playwright install-deps chromium

      - name: Run the end-to-end suite
        run: bash scripts/ci/e2e.sh

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: [test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ucm:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run -d --name ucm-test -p 8443:8443 \
            -e SECRET_KEY=test_secret_key_for_ci \
            ucm:test
          # HTTP 200 and a healthy body within the bound, or the step fails
          if ! scripts/ci/wait-health.sh https://localhost:8443/api/v2/health 120; then
            docker logs ucm-test
            exit 1
          fi

          echo "=== Docker Container Logs ==="
          docker logs ucm-test
          
          if docker ps | grep ucm-test; then
            echo "✅ Container is running"
          else
            echo "❌ Container exited"
            exit 1
          fi
          
          # A clean stop: the server received the signal and exited by itself
          docker stop ucm-test
          code=$(docker inspect -f '{{.State.ExitCode}}' ucm-test)
          docker rm ucm-test
          if [ "$code" != 0 ]; then
            echo "❌ Container was killed on stop (exit $code)"
            exit 1
          fi

  # Pushes to the integration and release branches: the source build is too slow for every PR
  build-test-fips:
    name: Docker Build Test (FIPS)
    runs-on: ubuntu-24.04
    needs: [test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main')
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (FIPS)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ucm:fips-test
          cache-from: type=gha,scope=fips-amd64
          cache-to: type=gha,mode=max,scope=fips-amd64
          build-args: |
            UCM_FIPS_BUILD=1

      - name: Check FIPS mode
        run: scripts/ci/check-fips-image.sh ucm:fips-test
