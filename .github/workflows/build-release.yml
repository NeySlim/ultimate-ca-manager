          ## Documentation
          - [Installation Guide](docs/installation/README.md)
          - [API Documentation](https://github.com/NeySlim/ultimate-ca-manager/wiki/API)
          
          INSTALL_EOF
          } > notes.md
          
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' notes.md
          
          # Replace placeholders (specific first, then generic)
          # File names use dots (2.1.0.rc2), not tildes (2.1.0~rc2)
          FILE_VERSION=$(echo "$VERSION" | sed 's/-/./g')
          sed -i "s|DEB_VERSION|${FILE_VERSION}|g" notes.md
          sed -i "s|RPM_VERSION|${FILE_VERSION}|g" notes.md
          sed -i "s|IMAGE|$IMAGE|g" notes.md
          sed -i "s|REPO|$REPO|g" notes.md
          sed -i "s|VERSION|$VERSION|g" notes.md
          
          rm -f "$CHANGES_FILE" "$PREVIOUS_FILE"
          cat notes.md
      
      - name: Delete existing release assets
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          for asset in $(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true); do
            echo "Deleting existing asset: $asset"
            gh release delete-asset "$TAG" "$asset" -y || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev') }}
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Workaround: if the tag was re-pointed (e.g. retag after fix), softprops/action-gh-release
      # does NOT overwrite the body of an existing release. Force-update it explicitly.
      - name: Force-update release body
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release edit "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
