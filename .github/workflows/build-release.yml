name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 2.48)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # Validate Release Tag
  # ============================================================
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tag points to the correct release branch
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG_SHA="$(git rev-parse HEAD)"

          if [[ "$VERSION" == *-rc* || "$VERSION" == *-beta* || "$VERSION" == *-alpha* || "$VERSION" == *-dev* ]]; then
            EXPECTED_REF="origin/test"
          else
            EXPECTED_REF="origin/main"
          fi

          git fetch origin main:refs/remotes/origin/main test:refs/remotes/origin/test
          EXPECTED_SHA="$(git rev-parse "$EXPECTED_REF")"

          echo "Version: $VERSION"
          echo "Tag SHA: $TAG_SHA"
          echo "Expected $EXPECTED_REF SHA: $EXPECTED_SHA"

          if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "Stable tags must point to origin/main; RC tags must point to origin/test."
            echo "Refusing to build release from an unexpected commit."
            exit 1
          fi

  # ============================================================
  # Build Debian Package
  # ============================================================
  build-deb:
    name: Build DEB Package
    runs-on: ubuntu-latest
    needs: [validate-tag]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.validate-tag.result == 'success')
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      deb_version: ${{ steps.version.outputs.deb_version }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          # Convert to DEB version (2.0.0-beta1 -> 2.0.0~beta1)
          DEB_VERSION=$(echo "$VERSION" | sed 's/-/~/g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "deb_version=$DEB_VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (DEB: $DEB_VERSION)"
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Stamp release version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Normalize semver for npm: 2.161-rc1 -> 2.161.0-rc1
          STAMP_VERSION=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+)-([a-zA-Z0-9]+)/\1.0-\2/')
          printf '%s' "$VERSION" > VERSION
          export VERSION
          export STAMP_VERSION
          node -e "const fs=require('fs'); const v=process.env.STAMP_VERSION; for (const f of ['frontend/package.json','frontend/package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; if (p.packages && p.packages['']) p.packages[''].version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper fakeroot devscripts dh-python python3-all
      
      - name: Update changelog version
        run: |
          VERSION="${{ steps.version.outputs.deb_version }}"
          DATE=$(date -R)
          cat > packaging/debian/changelog << EOF
          ucm ($VERSION) stable; urgency=medium

            * Release $VERSION

           -- UCM Team <support@ucm.local>  $DATE

          EOF
      
      - name: Build DEB package
        run: |
          # Create symlink for debian directory (dpkg expects debian/ at root)
          ln -s packaging/debian debian
          dpkg-buildpackage -us -uc -b
          mv ../ucm_*.deb .
          ls -la ucm_*.deb
      
      - name: Generate checksums
        run: |
          for f in ucm_*.deb; do
            # GitHub renames "~" to "." in asset names: write the published name so update clients match the line
            echo "$(sha256sum "$f" | cut -c1-64)  ${f//\~/.}" > "$f.sha256"
          done
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: |
            ucm_*.deb
            ucm_*.deb.sha256

  # ============================================================
  # Build RPM Package
  # ============================================================
  build-rpm:
    name: Build RPM Package (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: build-deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Fedora 43
            image: fedora:43
            artifact: rpm-package
            asset_prefix: ucm-
          # EL9 build: python3.12 instead of the system python3 (3.9). Its name sorts
          # after the Fedora RPM: updaters before 2.241 take the first .rpm asset by name.
          - label: EL9
            image: almalinux:9
            artifact: rpm-el9-package
            asset_prefix: ucm-el9-

    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Stamp release version
        run: |
          VERSION="${{ needs.build-deb.outputs.version }}"
          STAMP_VERSION=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+)-([a-zA-Z0-9]+)/\1.0-\2/')
          printf '%s' "$VERSION" > VERSION
          export VERSION STAMP_VERSION
          node -e "const fs=require('fs'); const v=process.env.STAMP_VERSION; for (const f of ['frontend/package.json','frontend/package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; if (p.packages && p.packages['']) p.packages[''].version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build RPM in ${{ matrix.label }} container
        run: |
          VERSION="${{ needs.build-deb.outputs.version }}"
          # For RPM Version field (supports ~), and for tarball name (use _)
          RPM_VERSION=$(echo "$VERSION" | sed 's/-/~/g')
          TAR_VERSION=$(echo "$VERSION" | sed 's/-/_/g')
          
          mkdir -p /tmp/rpm-output /tmp/rpm-build/ucm-${TAR_VERSION}
          
          # Copy only what's needed (NO node_modules, only dist/)
          cp -r backend packaging /tmp/rpm-build/ucm-${TAR_VERSION}/
          cp VERSION LICENSE NOTICE COMMERCIAL-LICENSE.md /tmp/rpm-build/ucm-${TAR_VERSION}/
          mkdir -p /tmp/rpm-build/ucm-${TAR_VERSION}/frontend
          cp -r frontend/dist /tmp/rpm-build/ucm-${TAR_VERSION}/frontend/
          
          # Create tarball
          tar -C /tmp/rpm-build -czf /tmp/rpm-build/ucm-${TAR_VERSION}.tar.gz ucm-${TAR_VERSION}
          
          docker run --rm \
            -v $(pwd):/workspace:ro \
            -v /tmp/rpm-build:/rpm-sources:ro \
            -v /tmp/rpm-output:/output \
            -e RPM_VERSION="$RPM_VERSION" \
            -e TAR_VERSION="$TAR_VERSION" \
            -e ASSET_PREFIX="${{ matrix.asset_prefix }}" \
            ${{ matrix.image }} bash -c '
              set -e
              dnf install -y rpm-build rpmdevtools python3 python3-pip systemd-rpm-macros
              
              rpmdev-setuptree
              
              # Copy tarball
              cp /rpm-sources/ucm-${TAR_VERSION}.tar.gz ~/rpmbuild/SOURCES/
              
              # Create spec from template with correct versions
              cp /workspace/packaging/rpm/ucm.spec ~/rpmbuild/SPECS/
              sed -i "s/^Version:.*/Version:        ${RPM_VERSION}/" ~/rpmbuild/SPECS/ucm.spec
              sed -i "s/^Source0:.*/Source0:        ucm-${TAR_VERSION}.tar.gz/" ~/rpmbuild/SPECS/ucm.spec
              sed -i "s/%setup -q/%setup -q -n ucm-${TAR_VERSION}/" ~/rpmbuild/SPECS/ucm.spec
              
              # Build
              rpmbuild -bb ~/rpmbuild/SPECS/ucm.spec
              
              # Copy outputs
              cp ~/rpmbuild/RPMS/noarch/*.rpm /output/
              cd /output && for f in *.rpm; do
                name=${ASSET_PREFIX}${f#ucm-}
                [ "$name" = "$f" ] || mv "$f" "$name"
                echo "$(sha256sum "$name" | cut -c1-64)  ${name//\~/.}" > "$name.sha256"
              done
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            /tmp/rpm-output/*.rpm
            /tmp/rpm-output/*.rpm.sha256

  # ============================================================
  # Build Docker Image
  # ============================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-deb
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Stamp release version
        run: |
          VERSION="${{ needs.build-deb.outputs.version }}"
          STAMP_VERSION=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+)-([a-zA-Z0-9]+)/\1.0-\2/')
          printf '%s' "$VERSION" > VERSION
          export VERSION STAMP_VERSION
          node -e "const fs=require('fs'); const v=process.env.STAMP_VERSION; for (const f of ['frontend/package.json','frontend/package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; if (p.packages && p.packages['']) p.packages[''].version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set image name
        id: image
        run: |
          echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
            neyslim/ultimate-ca-manager
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=raw,value=${{ needs.build-deb.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'dev') }}
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.build-deb.outputs.version }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: neyslim/ultimate-ca-manager
          readme-filepath: ./DOCKERHUB_README.md

  # ============================================================
  # Build Docker Image, FIPS variant (one native runner per arch)
  # ============================================================
  # continue-on-error on both FIPS jobs: a failed variant neither blocks the
  # release job nor fails the run that Release Smoke Tests waits on.
  build-docker-fips:
    name: Build Docker Image (FIPS, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build-deb
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # Native: Rust and lxml under QEMU would run past the hour
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Stamp release version
        run: |
          VERSION="${{ needs.build-deb.outputs.version }}"
          STAMP_VERSION=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+)-([a-zA-Z0-9]+)/\1.0-\2/')
          printf '%s' "$VERSION" > VERSION
          export VERSION STAMP_VERSION
          node -e "const fs=require('fs'); const v=process.env.STAMP_VERSION; for (const f of ['frontend/package.json','frontend/package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; if (p.packages && p.packages['']) p.packages[''].version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set image name
        id: image
        run: |
          echo "name=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
            neyslim/ultimate-ca-manager
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=raw,value=${{ needs.build-deb.outputs.version }}-fips

      - name: Build image for the FIPS check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: ucm:fips-check
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fips-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fips-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.build-deb.outputs.version }}
            UCM_FIPS_BUILD=1

      # Before any push: an image that fails here never reaches a registry
      - name: Check FIPS mode
        run: scripts/ci/check-fips-image.sh ucm:fips-check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same inputs as the checked build, so every layer comes from its cache
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},neyslim/ultimate-ca-manager",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=fips-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.build-deb.outputs.version }}
            UCM_FIPS_BUILD=1

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: fips-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the two per-arch digests as <version>-fips and latest-fips
  docker-fips-manifest:
    name: Publish Docker Image (FIPS)
    runs-on: ubuntu-latest
    needs: [build-deb, build-docker-fips]
    continue-on-error: true

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: fips-digest-*
          merge-multiple: true

      # A job with continue-on-error counts as passed: never tag a single arch
      - name: Require both architectures
        working-directory: ${{ runner.temp }}/digests
        run: |
          find . -type f -printf '%f\n'
          test "$(find . -type f | wc -l)" -eq 2

      - name: Set image name
        id: image
        run: |
          echo "name=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same rule as the standard image, with a -fips suffix
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
            neyslim/ultimate-ca-manager
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=raw,value=${{ needs.build-deb.outputs.version }}-fips
            type=raw,value=latest-fips,enable=${{ !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'dev') }}

      - name: Create manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          for repo in "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}" neyslim/ultimate-ca-manager; do
            mapfile -t tags < <(jq -r --arg r "$repo:" '.tags[] | select(startswith($r))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            test "${#tags[@]}" -ge 1
            args=()
            for t in "${tags[@]}"; do args+=(-t "$t"); done
            for d in *; do args+=("$repo@sha256:$d"); done
            docker buildx imagetools create "${args[@]}"
            docker buildx imagetools inspect "${tags[0]}"
          done

  # ============================================================
  # Create GitHub Release
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-deb, build-rpm, build-docker]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Download DEB artifact
        uses: actions/download-artifact@v7
        with:
          name: deb-package
          path: ./artifacts
      
      - name: Download RPM artifact
        uses: actions/download-artifact@v7
        with:
          name: rpm-package
          path: ./artifacts

      - name: Download EL9 RPM artifact
        uses: actions/download-artifact@v7
        with:
          name: rpm-el9-package
          path: ./artifacts

      - name: Check the RPM taken by older updaters
        # Updaters before 2.241 install the first .rpm asset by name: it must be the Fedora one
        run: |
          FIRST=$(cd artifacts && ls -1 *.rpm | LC_ALL=C sort | head -n 1)
          case "$FIRST" in
            ucm-[0-9]*.fc43.noarch.rpm) echo "First RPM asset: $FIRST" ;;
            *) echo "::error::the first RPM asset by name is $FIRST, not the Fedora build"; exit 1 ;;
          esac
      
      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.build-deb.outputs.version }}"
          IMAGE="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          REPO="${{ github.repository }}"
          
          # Extract changelog section for this version
          CHANGES_FILE=$(mktemp)
          PREVIOUS_FILE=$(mktemp)
          if [ -f CHANGELOG.md ]; then
            # Extract content between ## [VERSION] and the next ## [
            SECTION=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | head -n -1)
            if [ -z "$SECTION" ]; then
              SECTION=$(sed -n "/^## ${VERSION}/,/^## /p" CHANGELOG.md | head -n -1)
            fi
            # Remove the heading line itself, keep the content
            echo "$SECTION" | tail -n +2 | sed '/^$/d; 1i\\' > "$CHANGES_FILE" || true

            # Extract the 2 previous versioned sections (skip Unreleased and current)
            # Output is the raw markdown blocks (heading + body) so users see version + date.
            awk -v current="${VERSION}" '
              /^## \[Unreleased\]/ { capture=0; next }
              /^## \[/ {
                line = $0
                sub(/^## \[/, "", line)
                sub(/\].*$/, "", line)
                ver = line
                if (ver == current) { capture=0; next }
                if (count >= 2) { capture=0; exit }
                count++
                capture=1
              }
              capture { print }
            ' CHANGELOG.md > "$PREVIOUS_FILE" || true
          fi
          
          # Build release notes
          {
            if [ -s "$CHANGES_FILE" ]; then
              echo "## What's Changed"
              echo ""
              cat "$CHANGES_FILE"
              echo ""
              echo "---"
              echo ""
            fi
            if [ -s "$PREVIOUS_FILE" ]; then
              echo "<details>"
              echo "<summary><strong>📜 Recent release history (last 2 versions)</strong></summary>"
              echo ""
              cat "$PREVIOUS_FILE"
              echo ""
              echo "Full history: [CHANGELOG.md](https://github.com/REPO/blob/main/CHANGELOG.md)"
              echo "</details>"
              echo ""
              echo "---"
              echo ""
            fi
            cat << 'INSTALL_EOF'
          ## Installation
          
          ### Docker (Recommended)
          ```bash
          # From Docker Hub
          docker pull neyslim/ultimate-ca-manager:VERSION
          
          # Or from GitHub Container Registry
          docker pull IMAGE:VERSION
          
          # Run
          docker run -d -p 8443:8443 \
            -e SECRET_KEY=$(openssl rand -hex 32) \
            --name ucm neyslim/ultimate-ca-manager:VERSION
          ```
          
          ### Debian/Ubuntu
          ```bash
          wget https://github.com/REPO/releases/download/vVERSION/ucm_DEB_VERSION_all.deb
          sudo dpkg -i ucm_DEB_VERSION_all.deb
          sudo apt-get install -f
          ```
          
          ### Fedora
          ```bash
          wget https://github.com/REPO/releases/download/vVERSION/ucm-RPM_VERSION-1.fc43.noarch.rpm
          sudo dnf install ./ucm-RPM_VERSION-1.fc43.noarch.rpm
          ```

          ### RHEL, AlmaLinux, Rocky Linux 9
          ```bash
          wget https://github.com/REPO/releases/download/vVERSION/ucm-el9-RPM_VERSION-1.el9.noarch.rpm
          sudo dnf install ./ucm-el9-RPM_VERSION-1.el9.noarch.rpm
          ```
          
          ### FIPS mode (preview)
          FIPS mode is a preview: feedback is welcome on [#399](https://github.com/REPO/issues/399). Full guide: [FIPS Mode](https://github.com/REPO/wiki/FIPS-Mode).
          
          Docker, any Linux host (amd64, arm64):
          ```bash
          docker run -d -p 8443:8443 -e UCM_FIPS=1 \
            -v ucm-data:/opt/ucm/data -v ucm-config:/etc/ucm \
            --name ucm neyslim/ultimate-ca-manager:VERSION-fips
          ```
          
          Ubuntu 24.04 with Ubuntu Pro (`sudo pro enable fips-updates`, then reboot):
          ```bash
          sudo apt-get install -y gcc pkg-config python3-dev python3-venv libpq-dev libxml2-dev libxslt1-dev \
              zlib1g-dev libssl-dev libxmlsec1-dev libxmlsec1t64-openssl rustc-1.91 cargo-1.91
          sudo install -d -m 750 /etc/ucm && echo 'UCM_FIPS_BUILD=1' | sudo tee /etc/ucm/ucm.env
          sudo apt install ./ucm_DEB_VERSION_all.deb
          ```
          
          RHEL, AlmaLinux, Rocky Linux 9 (`sudo fips-mode-setup --enable`, then reboot; on RHEL, enable CodeReady Builder instead of CRB):
          ```bash
          sudo dnf config-manager --set-enabled crb
          sudo dnf install -y python3.12-devel gcc pkgconf-pkg-config libpq-devel libxml2-devel libxslt-devel \
              openssl-devel xmlsec1-devel xmlsec1-openssl libtool-ltdl-devel rust cargo
          sudo install -d -m 750 /etc/ucm && echo 'UCM_FIPS_BUILD=1' | sudo tee /etc/ucm/ucm.env
          sudo dnf install ./ucm-el9-RPM_VERSION-1.el9.noarch.rpm
          ```
          
          The package builds its crypto libraries against the system OpenSSL (about five minutes), sets `UCM_FIPS=1` on a host in FIPS mode and prints a readiness report. Fedora, Debian and other distributions are not supported in FIPS mode: use the Docker image.
          
          ### Silent/Automated Install
          ```bash
          # Skip firewall prompts for CI/automation
          sudo UCM_PORT=8443 UCM_FIREWALL=no dpkg -i ucm_DEB_VERSION_all.deb
          ```
          
