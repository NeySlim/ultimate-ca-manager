name: Release Smoke Tests

# Called by Build & Release on a tag before anything is published, so this definition
# and the scripts it runs are those of the tag; every checkout names that tag. A call
# smokes the run's own output (images by digest, packages from its artifacts); a manual
# run smokes the published images and packages. Runs smoke_release.py against them.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to smoke; the tag checked out is v<version>'
        required: true
        type: string
      image:
        description: 'Docker image without tag or registry port'
        required: false
        default: 'neyslim/ultimate-ca-manager'
        type: string
      from-run:
        description: 'Smoke the calling run: images by the digests below, packages from its artifacts'
        required: false
        default: false
        type: boolean
      image-digest:
        description: 'Digest (sha256:...) of the standard image to pull instead of its version tag'
        required: false
        default: ''
        type: string
      fips-image-digest:
        description: 'Digest (sha256:...) of the FIPS image to pull instead of its version tag'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to smoke (e.g., 2.143)'
        required: true
        type: string
      image:
        description: 'Docker image without tag or registry port (default: neyslim/ultimate-ca-manager)'
        required: false
        default: 'neyslim/ultimate-ca-manager'
        type: string

permissions:
  contents: read

jobs:
  smoke-sqlite:
    name: Smoke (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Resolve version
        id: ver
        # Inputs reach the shell through env and are validated, never interpolated.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_DIGEST: ${{ inputs.image-digest }}
          INPUT_FROM_RUN: ${{ inputs.from-run }}
        run: |
          VER="$INPUT_VERSION"
          IMAGE="${INPUT_IMAGE:-neyslim/ultimate-ca-manager}"
          python3 scripts/ci/release_version.py validate "$VER"
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9./_-]*$ ]] || { echo "Invalid image: $IMAGE"; exit 1; }
          # A release call pulls the untagged image its run built, never a tag that may be older
          if [ "$INPUT_FROM_RUN" = true ] || [ -n "$INPUT_DIGEST" ]; then
            [[ "$INPUT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest: $INPUT_DIGEST"; exit 1; }
            REF="$IMAGE@$INPUT_DIGEST"
          else
            REF="$IMAGE:$VER"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Determine RC flag
        id: rc
        run: |
          if [[ "${{ steps.ver.outputs.version }}" == *-rc* ]]; then
            echo "flag=--allow-rc" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Docker image
        run: |
          docker pull "${{ steps.ver.outputs.ref }}"

      - name: Boot UCM container (SQLite)
        run: |
          docker run -d --name ucm-smoke -p 8443:8443 \
            -e SECRET_KEY=ci_smoke_secret_key \
            -e INITIAL_ADMIN_PASSWORD=changeme123 \
            "${{ steps.ver.outputs.ref }}"
          scripts/ci/wait-health.sh https://localhost:8443/api/v2/health 60 || { docker logs ucm-smoke; exit 1; }

      - name: Run release smoke
        run: |
          python3 scripts/smoke_release.py \
            --version "${{ steps.ver.outputs.version }}" \
            ${{ steps.rc.outputs.flag }} \
            --admin-password changeme123 \
            --target "Docker SQLite=https://localhost:8443"

      - name: Container logs on failure
        if: failure()
        run: docker logs ucm-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f ucm-smoke || true

  # Installs each package in the container of its distribution: from the calling run's
  # artifacts, or the published asset by hand. Debian 12 is not covered: the packages
  # need python3 >= 3.12.
  smoke-packages:
    name: Package ${{ matrix.image }} (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'debian:13', label: DEB, pattern: 'ucm_*_all.deb'}
          - {image: 'ubuntu:24.04', label: DEB, pattern: 'ucm_*_all.deb'}
          - {image: 'ubuntu:26.04', label: DEB, pattern: 'ucm_*_all.deb'}
          - {image: 'almalinux:9', label: RPM el9, pattern: 'ucm-el9-*.el9.noarch.rpm'}
          - {image: 'almalinux:10', label: RPM el10, pattern: 'ucm-el10-*.el10.noarch.rpm'}
          - {image: 'fedora:43', label: RPM Fedora, pattern: 'ucm-[0-9]*.fc43.noarch.rpm'}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Resolve version
        id: ver
        # The input reaches the shell through env and is validated, never interpolated.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VER="$INPUT_VERSION"
          python3 scripts/ci/release_version.py validate "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Take the packages of the calling run
        if: inputs.from-run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-package'
          path: run-artifacts
          merge-multiple: true

      - name: Get the package and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PATTERN: ${{ matrix.pattern }}
          FROM_RUN: ${{ inputs.from-run }}
        run: |
          mkdir pkg
          if [ "$FROM_RUN" = true ]; then
            # Under the name the release will give it ("~" turned into "."), which its checksum line carries
            for f in run-artifacts/$PATTERN run-artifacts/$PATTERN.sha256; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              cp "$f" "pkg/${name//\~/.}"
            done
          else
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir pkg \
              --pattern "$PATTERN" --pattern "$PATTERN.sha256"
          fi
          test "$(ls pkg/*.sha256 | wc -l)" -eq 1
          (cd pkg && sha256sum -c ./*.sha256)

      - name: Install and run in the distribution container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/scripts/ci/package-smoke.sh:/smoke.sh:ro" \
            "$IMAGE" sh -c 'sh /smoke.sh $(ls /pkg/*.deb /pkg/*.rpm 2>/dev/null | head -n 1)'

  smoke-postgres:
    name: Smoke (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucm
          POSTGRES_PASSWORD: ucm_ci_password
          POSTGRES_DB: ucm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Resolve version
        id: ver
        # Inputs reach the shell through env and are validated, never interpolated.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_DIGEST: ${{ inputs.image-digest }}
          INPUT_FROM_RUN: ${{ inputs.from-run }}
        run: |
          VER="$INPUT_VERSION"
          IMAGE="${INPUT_IMAGE:-neyslim/ultimate-ca-manager}"
          python3 scripts/ci/release_version.py validate "$VER"
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9./_-]*$ ]] || { echo "Invalid image: $IMAGE"; exit 1; }
          # A release call pulls the untagged image its run built, never a tag that may be older
          if [ "$INPUT_FROM_RUN" = true ] || [ -n "$INPUT_DIGEST" ]; then
            [[ "$INPUT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest: $INPUT_DIGEST"; exit 1; }
            REF="$IMAGE@$INPUT_DIGEST"
          else
            REF="$IMAGE:$VER"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Determine RC flag
        id: rc
        run: |
          if [[ "${{ steps.ver.outputs.version }}" == *-rc* ]]; then
            echo "flag=--allow-rc" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Docker image
        run: docker pull "${{ steps.ver.outputs.ref }}"

      - name: Boot UCM container (PostgreSQL)
        # Service container is reachable via host networking from job runner;
        # the UCM container needs --network host to reach localhost:5432.
        # Regression guard for #103 / #104: this MUST start cleanly on PG.
        run: |
          docker run -d --name ucm-smoke --network host \
            -e SECRET_KEY=ci_smoke_secret_key \
            -e INITIAL_ADMIN_PASSWORD=changeme123 \
            -e DATABASE_URL=postgresql://ucm:ucm_ci_password@localhost:5432/ucm \
            "${{ steps.ver.outputs.ref }}"
          scripts/ci/wait-health.sh https://localhost:8443/api/v2/health 90 || { docker logs ucm-smoke; exit 1; }

      - name: Run release smoke
        run: |
          python3 scripts/smoke_release.py \
            --version "${{ steps.ver.outputs.version }}" \
            ${{ steps.rc.outputs.flag }} \
            --admin-password changeme123 \
            --target "Docker PostgreSQL=https://localhost:8443"

      - name: Container logs on failure
        if: failure()
        run: docker logs ucm-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f ucm-smoke || true

  smoke-fips:
    name: Smoke (SQLite, FIPS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Resolve version
        id: ver
        # Inputs reach the shell through env and are validated, never interpolated.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_DIGEST: ${{ inputs.fips-image-digest }}
          INPUT_FROM_RUN: ${{ inputs.from-run }}
        run: |
          VER="$INPUT_VERSION"
          IMAGE="${INPUT_IMAGE:-neyslim/ultimate-ca-manager}"
          python3 scripts/ci/release_version.py validate "$VER"
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9./_-]*$ ]] || { echo "Invalid image: $IMAGE"; exit 1; }
          # A release call pulls the untagged image its run built, never a tag that may be older
          if [ "$INPUT_FROM_RUN" = true ] || [ -n "$INPUT_DIGEST" ]; then
            [[ "$INPUT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest: $INPUT_DIGEST"; exit 1; }
            REF="$IMAGE@$INPUT_DIGEST"
          else
            REF="$IMAGE:$VER-fips"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Determine RC flag
        id: rc
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [[ "$VERSION" == *-rc* ]]; then
            echo "flag=--allow-rc" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Docker image
        run: docker pull "${{ steps.ver.outputs.ref }}"

      - name: Boot UCM container (UCM_FIPS=1)
        env:
          FIPS_CHECK_KEEP: '1'
        run: |
          scripts/ci/check-fips-image.sh \
            "${{ steps.ver.outputs.ref }}" ucm-smoke 8443

      - name: Run release smoke
        run: |
          python3 scripts/smoke_release.py \
            --version "${{ steps.ver.outputs.version }}" \
            ${{ steps.rc.outputs.flag }} \
            --admin-password changeme123 \
            --target "Docker SQLite FIPS=https://localhost:8443"

      - name: Container logs on failure
        if: failure()
        run: docker logs ucm-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f ucm-smoke || true
