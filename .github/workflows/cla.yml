name: CLA

# Reports which authors of a pull request have signed the contributor licence
# agreement, and refuses changes to the agreement or to existing signatures.
#
# What this is: an aid to the reviewer, so an unsigned contribution is not merged by
# inattention. It reads only, and never writes to a branch.
#
# What this is not: proof of who signed. The author of a git commit is declarative,
# so without GPG or SSH signatures anyone can write a commit under another name, and
# anyone can type another person's name into the signature file. A green check means
# "every author named here appears in the signature file", not "these people
# consented". The evidence that a given person agreed is the public, timestamped
# trail of their own pull request, not this job and not the merge.
#
# pull_request_target runs the copy of this file on the default branch, so a pull
# request cannot edit the check that judges it. That is also why the check only
# starts working once this file has reached the default branch. No code from the
# pull request is checked out or executed: everything is read through the API, and
# a fork's content is read from refs/pull/N/head on the base repository, which the
# base token can always reach.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  signed:
    name: Contributors have signed the CLA
    runs-on: ubuntu-latest
    steps:
      - name: Check signatures
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          SIGNATURES=signatures/cla-v1.1.md
          STATEMENT='I have read and agree to the UCM CLA v1.1'
          # Superseded versions stay in the tree and stay immutable too.
          FROZEN='CLA-v1.0.md CLA-v1.1.md'
          # Accounts that never sign: the maintainer, and bots whose commits are
          # generated rather than authored. Named one by one on purpose: a wildcard
          # such as *[bot] would exempt any account someone chooses to call a bot.
          EXEMPT='neyslim dependabot[bot] github-actions[bot] renovate[bot] copilot app/dependabot app/github-actions app/renovate app/copilot'

          # refs/pull/N/head exists on the base repository for every pull request,
          # fork or not, so one token reaches both sides.
          at_ref() {
            gh api "repos/$REPO/contents/$1?ref=$2" --jq '.content' 2>/dev/null \
              | base64 -d 2>/dev/null || true
          }
          at_ref "$SIGNATURES" "refs/pull/$PR/head" > sig-pr.txt
          at_ref "$SIGNATURES" "$BASE_REF"          > sig-base.txt
          # What the pull request changed is measured from where it branched, not
          # from the base tip: a signature merged into the base after that point is
          # absent from an older branch without having been removed by it.
          MERGE_BASE=$(gh api "repos/$REPO/compare/$BASE_REF...refs/pull/$PR/head" \
            --jq '.merge_base_commit.sha' 2>/dev/null || true)
          if [ -n "$MERGE_BASE" ]; then
            at_ref "$SIGNATURES" "$MERGE_BASE" > sig-fork.txt
          else
            cp sig-base.txt sig-fork.txt
          fi
          fail=0

          # An agreement is immutable once published: changing its terms means a new
          # version, with its own signature list. A pull request that edits one is
          # rejected here rather than noticed later. Every published version is
          # checked, not only the one in force: an old text still binds whoever
          # signed it.
          for doc in $FROZEN; do
            at_ref "$doc" "refs/pull/$PR/head" > cla-pr.txt
            at_ref "$doc" "${MERGE_BASE:-$BASE_REF}" > cla-base.txt
            if [ -s cla-base.txt ] && ! cmp -s cla-base.txt cla-pr.txt; then
              echo "::error::$doc is modified by this pull request. A published"\
                   "agreement cannot change: add a new version with its own signature file."
              fail=1
            fi
          done

          # Rows carrying the exact statement, lower-cased, compared literally: the
          # file is contributor-supplied, so a name never acts as a pattern.
          signatories() {
            awk -F'|' -v want="$STATEMENT" '
              NF >= 4 {
                who = $2; stmt = $4
                gsub(/^[ \t]+|[ \t]+$/, "", who)
                gsub(/^[ \t]+|[ \t]+$/, "", stmt)
                if (stmt == want && who != "" && who !~ /^-+$/ && tolower(who) != "github username" && tolower(who) != "your-github-username")
                  print tolower(who)
              }' "$1" | sort -u
          }
          signatories sig-base.txt > signed-base.txt
          signatories sig-fork.txt > signed-fork.txt
          { signatories sig-pr.txt; cat signed-base.txt; } | sort -u > signed.txt

          # An existing signature is never removed or reworded by someone else.
          if [ -s signed-fork.txt ]; then
            dropped=$(comm -23 signed-fork.txt <(signatories sig-pr.txt) | tr '\n' ' ')
            if [ -n "${dropped// /}" ]; then
              echo "::error::This pull request removes signatures on file: $dropped"
              fail=1
            fi
          fi

          # A signature is added by its own signatory, in a pull request of theirs:
          # a line naming anyone else is not a signature, whoever wrote it.
          author=$(gh pr view "$PR" --repo "$REPO" --json author --jq '.author.login' \
            | tr '[:upper:]' '[:lower:]')
          while IFS= read -r who; do
            [ -z "$who" ] && continue
            if [ "$who" != "$author" ]; then
              echo "::error::This pull request adds a signature for $who, but its author"\
                   "is $author. Each contributor signs in a pull request of their own."
              fail=1
            fi
          done < <(comm -13 signed-fork.txt <(signatories sig-pr.txt))
          # A signature on file is kept byte for byte: its date and statement are
          # the signatory's, not the next contributor's to touch.
          while IFS= read -r row; do
            [ -z "$row" ] && continue
            if ! grep -Fxq -- "$row" sig-pr.txt; then
              echo "::error::A signature on file was altered by this pull request: $row"
              fail=1
            fi
          done < <(grep -F -- "$STATEMENT" sig-fork.txt || true)

          echo "Signatories on file: $(wc -l < signed.txt)"

          is_signed() {
            local who low
            who="$1"
            low=$(printf '%s' "$who" | tr '[:upper:]' '[:lower:]')
            case " $EXEMPT " in *" $low "*) return 0 ;; esac
            grep -Fxq -- "$low" signed.txt
          }

          missing=""

          # Accounts GitHub attributes a commit to, plus the pull request author.
          {
            gh pr view "$PR" --repo "$REPO" --json author --jq '.author.login'
            gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[] | .author.login // empty'
          } | sort -u > authors.txt
          while read -r who; do
            [ -z "$who" ] && continue
            is_signed "$who" || missing="$missing $who"
          done < authors.txt

          # A commit whose email GitHub links to no account counts as the pull
          # request author's, checked above. The name on it cannot be verified, so
          # the author attests in the description that it is theirs to submit.
          ATTEST='I confirm that commits with an unlinked author email are my own work, or that I am authorised by their copyright holder to submit and license them under the UCM CLA v1.1.'
          gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.author == null) | .commit.author.name' | sort -u > unlinked.txt
          if [ -s unlinked.txt ]; then
            if ! gh pr view "$PR" --repo "$REPO" --json body --jq '.body' | tr -d '\r' \
              | sed -nE 's/^[[:space:]]*[-*][[:space:]]*\[[xX]\][[:space:]]*//p' \
              | sed 's/[[:space:]]*$//' | grep -Fxi -- "$ATTEST" > /dev/null; then
              echo "::error::Commits by $(paste -sd ';' unlinked.txt | sed 's/;/, /g') carry an email linked to no"\
                   "GitHub account. Tick this line in the pull request description: - [x] $ATTEST"
              fail=1
            fi
          fi

          # Co-authors hold copyright on what they wrote, so they are checked too.
          # The trailer is free text: both the name and the address are looked up,
          # literally, and either one being on file is enough.
          # grep finds nothing on most pull requests, and under pipefail that must
          # not be a failure.
          gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[] | .commit.message' \
            | { grep -oiP '^Co-authored-by:\s*\K.*' || true; } | sort -u > coauthors.txt
          while read -r line; do
            [ -z "$line" ] && continue
            name=${line%%<*}
            name=$(printf '%s' "$name" | sed 's/[[:space:]]*$//')
            mail=$(printf '%s' "$line" | sed -n 's/.*<\(.*\)>.*/\1/p')
            if ! { [ -n "$name" ] && is_signed "$name"; } \
              && ! { [ -n "$mail" ] && is_signed "$mail"; }; then
              missing="$missing \"$line\"(co-author)"
            fi
          done < coauthors.txt

          if [ -z "$missing" ] && [ "$fail" -eq 0 ]; then
            echo "Every author named in this pull request appears in the signature file."
            exit 0
          fi

          [ -n "$missing" ] && echo "::error::No signature on file for:$missing"
          cat <<'MESSAGE'

          This pull request should not be merged until every author has signed the
          contributor licence agreement.

          Signing takes one line. In this same pull request, add yourself to the end
          of the table in signatures/cla-v1.1.md, keeping the wording exactly:

              | your-github-username | YYYY-MM-DD | I have read and agree to the UCM CLA v1.1 |

          A co-author signs the same way, under their own GitHub username and in a
          pull request of their own, and the Co-authored-by trailer carries that
          username. A commit whose email is not linked to a GitHub account counts
          as the pull request author's, who ticks this line in the description:

              - [x] I confirm that commits with an unlinked author email are my own work, or that I am authorised by their copyright holder to submit and license them under the UCM CLA v1.1.

          Anyone else who took part still signs for themselves, named in a
          Co-authored-by trailer.

          You keep the copyright on your work. The agreement lets the project
          distribute it under its free licence and, separately, under a commercial
          licence, which is what funds the development. You are asked once, and it
          covers everything you have contributed, before and after.

          The agreement: https://github.com/NeySlim/ultimate-ca-manager/blob/main/CLA-v1.1.md

          MESSAGE
          exit 1
