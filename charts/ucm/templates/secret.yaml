{{- /*
App secrets. UCM_SECRET_KEY and UCM_INITIAL_ADMIN_PASSWORD are generated once and
persisted across upgrades by reading back the existing Secret, so user sessions survive
restarts and the password stays readable with kubectl. Explicit values take precedence.
*/ -}}
{{- $secretName := include "ucm.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $existingData := $existing.data | default dict -}}
{{- $secretKey := .Values.secrets.secretKey -}}
{{- if not $secretKey }}{{- $secretKey = (get $existingData "UCM_SECRET_KEY" | b64dec) | default (randAlphaNum 48) -}}{{- end -}}
{{- $adminPassword := .Values.initialAdminPassword -}}
{{- /* No 0/O/o, 1/l/I: 56 symbols, uniform over them; 64 draws leave far more than 24 */ -}}
{{- $drawn := regexReplaceAll "[0Oo1lI]" (randAlphaNum 64) "" | trunc 24 -}}
{{- if not $adminPassword }}{{- $adminPassword = (get $existingData "UCM_INITIAL_ADMIN_PASSWORD" | b64dec) | default $drawn -}}{{- end -}}
{{- $kek := include "ucm.existingKek" . -}}
{{- if and (not $kek) .Values.ha.enabled }}{{- $kek = randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ucm.labels" . | nindent 4 }}
  {{- if $kek }}
  annotations:
    # The only copy of the key that encrypts private keys: never delete it.
    "helm.sh/resource-policy": keep
  {{- end }}
type: Opaque
stringData:
  UCM_SECRET_KEY: {{ $secretKey | quote }}
  {{- if $kek }}
  KEY_ENCRYPTION_KEY: {{ $kek | quote }}
  {{- end }}
  {{- if not (include "ucm.adminPasswordFromExtraEnv" .) }}
  UCM_INITIAL_ADMIN_PASSWORD: {{ $adminPassword | quote }}
  {{- end }}
  {{- if and (eq .Values.database.type "postgresql") .Values.database.databaseUrl (not .Values.database.existingSecret) }}
  DATABASE_URL: {{ .Values.database.databaseUrl | quote }}
  {{- end }}
