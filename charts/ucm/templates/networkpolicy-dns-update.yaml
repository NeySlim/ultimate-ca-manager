{{- if and .Values.dnsUpdate.enabled .Values.dnsUpdate.networkPolicy.enabled }}
## Any policy that selects a pod denies all ingress that no policy allows.
## So this policy has two rules: the DNS UPDATE ports only from the listed
## peers, and the HTTPS and HTTP ports from everywhere (as without a policy).
## With an empty `from` list, nothing reaches the DNS UPDATE ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ucm.fullname" . }}-dns-update
  labels:
    {{- include "ucm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ucm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: https
          protocol: TCP
        - port: http
          protocol: TCP
    {{- with .Values.dnsUpdate.networkPolicy.from }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.dnsUpdate.port }}
          protocol: UDP
        - port: {{ $.Values.dnsUpdate.port }}
          protocol: TCP
    {{- end }}
{{- end }}
