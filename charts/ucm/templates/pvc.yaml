{{- if .Values.persistence.enabled }}
{{- $dataPvc := include "ucm.dataPvcName" . }}
{{- if and (not .Values.persistence.data.existingClaim) (or (not .Values.ha.enabled) (lookup "v1" "PersistentVolumeClaim" .Release.Namespace $dataPvc)) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $dataPvc }}
  labels:
    {{- include "ucm.labels" . | nindent 4 }}
  {{- if .Values.ha.enabled }}
  annotations:
    # HA leaves the claim of a former single-node release unmounted (SQLite database,
    # SoftHSM tokens, uploads, backups): still rendered, and kept, so the switch deletes nothing.
    "helm.sh/resource-policy": keep
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.ha.enabled }}
---
{{- if not .Values.persistence.etc.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ucm.etcPvcName" . }}
  labels:
    {{- include "ucm.labels" . | nindent 4 }}
  annotations:
    # /etc/ucm holds master.key — deleting this PVC makes every encrypted
    # private key in the database unrecoverable. Keep it.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - {{ .Values.persistence.etc.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.etc.size | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
