# Default values for the UCM Helm chart.
# UCM defaults to a single instance on a local SQLite database: keep replicaCount
# at 1. For several nodes set ha.enabled=true (see docs/HA.md): it needs
# PostgreSQL and replicaCount >= 2.

image:
  repository: neyslim/ultimate-ca-manager
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

## Single instance unless ha.enabled (then 2 or more).
replicaCount: 1

## High availability (UCM_HA=1): several nodes on one PostgreSQL. The render
## fails unless database.type=postgresql and replicaCount >= 2. Each pod gets
## UCM_NODE_ID = pod name; UCM_SECRET_KEY and KEY_ENCRYPTION_KEY come from the
## one shared Secret (generated once, kept across upgrades). There is no etc
## PVC. The data volume is an emptyDir per pod (local backups are lost with the
## pod), or the persistence.data.existingClaim you name (ReadWriteMany).
## Without a Redis URL, sessions stay per node: set an ingress cookie affinity.
ha:
  enabled: false
  podDisruptionBudget:
    minAvailable: 1

## Optional Redis shared by the nodes (sets REDIS_URL in HA mode).
redis:
  url: ""

## Fully qualified domain name UCM serves on. Used for the self-signed UI
## certificate and as the default base URL for issued AIA/CRL/OCSP URLs.
fqdn: ucm.local

## Initial admin password (first boot only). Empty: the chart generates one into its
## Secret and keeps it across upgrades (lookup); read it with
##   kubectl get secret <fullname>-secrets -o jsonpath='{.data.UCM_INITIAL_ADMIN_PASSWORD}' | base64 -d
## helm template and GitOps tools have no lookup: set it there, or it changes at each render.
## The generated value must be changed at first login; a value set here is yours, no change forced.
## Your own Secret instead: add INITIAL_ADMIN_PASSWORD (valueFrom secretKeyRef) or
## INITIAL_ADMIN_PASSWORD_FILE (with the volume) to extraEnv; the chart then passes no password
## of its own and forces no change.
initialAdminPassword: ""

## App secrets. If left empty the chart generates random values on first install
## and PERSISTS them across upgrades (via lookup) so sessions survive restarts.
secrets:
  secretKey: ""   # UCM_SECRET_KEY (Flask)
  keyEncryptionKey: ""   # KEY_ENCRYPTION_KEY (Fernet key), passed to the pods whenever set or already in the Secret. Generated only with ha.enabled: there, helm template or GitOps (no cluster lookup) would generate a new key at each render, so set it.

## Database backend.
##  - sqlite (default): file in the data PVC, single instance.
##  - postgresql: set databaseUrl to an external PostgreSQL 13+ (HA-capable
##    storage, but the app itself still runs as a single replica).
database:
  type: sqlite
  # e.g. postgresql://ucm:password@postgres:5432/ucm  (used when type=postgresql)
  databaseUrl: ""
  # Reference an existing Secret key instead of putting the URL in values.
  existingSecret: ""
  existingSecretKey: DATABASE_URL

## Persistence. /etc/ucm holds master.key (decrypts every private key in the DB)
## and MUST survive pod restarts — losing it makes all encrypted keys
## unrecoverable. /opt/ucm/data holds the DB, CA files, sessions and backups.
persistence:
  enabled: true
  storageClass: ""
  data:
    size: 5Gi
    accessMode: ReadWriteOnce
    existingClaim: ""
  etc:
    size: 64Mi
    accessMode: ReadWriteOnce
    existingClaim: ""

## Reverse proxy / ingress in front of UCM.
## When something proxies to UCM (an ingress controller, or a standalone
## nginx/HAProxy), enable this so UCM honors X-Forwarded-* and any
## proxy-injected client-certificate headers, but ONLY from the peers listed
## in trustedProxies. The immediate peer is the proxy's own pod IP, which is
## never loopback (the default trust), so without trustedProxies the
## forwarded headers are ignored and requests can 403.
proxy:
  # Sets UCM_BEHIND_PROXY=1, which enables ProxyFix for one proxy hop.
  behindProxy: false
  # UCM_TRUSTED_PROXIES: list of proxy IP addresses or CIDR networks allowed
  # to set forwarded / client-cert headers. Use the ingress controller's pod
  # network (its pod IP rotates), e.g. the CNI pod CIDR:
  #   trustedProxies:
  #     - 10.42.0.0/16
  # CIDR entries need UCM 2.224 or later (the chart's appVersion). With an
  # older image.tag, list exact IP addresses only: an older UCM keeps a CIDR
  # entry as a literal string that never matches, and trusts no proxy.
  trustedProxies: []

## FIPS mode: runs the <tag>-fips image with UCM_FIPS=1 and an in-memory
## /run/ucm for the module configuration. The pod refuses to start if the
## OpenSSL FIPS provider is missing or fails its self-tests.
fips:
  enabled: false

## Extra environment variables (UCM_* etc.), passed verbatim.
extraEnv: []
  # - name: UCM_LOG_LEVEL
  #   value: DEBUG

service:
  type: ClusterIP
  httpsPort: 8443   # UI / API / ACME / SCEP / EST (TLS terminated by UCM)
  httpPort: 8080    # CDP / OCSP / AIA protocol endpoints (plain HTTP)
  annotations: {}

## DNS UPDATE (RFC 2136) listener of the ACME proxy. For INTERNAL networks only:
## never expose it to the internet. Off by default.
## The listener has its own Service, so that exposing the HTTPS UI (Service,
## Ingress, LoadBalancer) never exposes the listener. The pod runs as a
## non-root user and cannot bind port 53: the Service maps port 53 to `port`.
## The per-account TSIG keys are created in the UCM web interface.
dnsUpdate:
  enabled: false
  port: 8053            # container port, UDP and TCP, 1024..65535 (sets UCM_DNS_UPDATE_PORT)
  host: ""              # bind address inside the pod (sets UCM_DNS_UPDATE_HOST), empty = default
  service:
    type: ClusterIP     # LoadBalancer needs mixed UDP/TCP support from your cloud
    port: 53            # port that DNS clients use
    annotations: {}
    loadBalancerIP: ""
  ## Additional NetworkPolicy. While it is enabled, it closes EVERY port of the
  ## pod that it does not allow (NetworkPolicies are additive allow-lists):
  ## - from all sources: the https and http ports and `extraPorts`;
  ## - only from `from`: the DNS UPDATE ports.
  ## `from` is a list of NetworkPolicy peers (podSelector, namespaceSelector,
  ## ipBlock). An empty list with enabled: true denies all ingress to the
  ## listener ports.
  ## `extraPorts` lists other ports that must stay open to all sources, as
  ## {port: <number or name>, protocol: TCP|UDP}. Example: the ACME client
  ## TLS-ALPN-01 proof listener, or a port added through `extraEnv`.
  ## The policy needs a CNI that enforces NetworkPolicy.
  networkPolicy:
    enabled: false
    extraPorts: []
      # - port: 8443
      #   protocol: TCP
    from: []
      # - namespaceSelector:
      #     matchLabels:
      #       kubernetes.io/metadata.name: cert-manager

## Ingress. UCM terminates TLS itself, so for the HTTPS UI you typically want
## passthrough OR a controller annotation telling it the backend speaks HTTPS
## (e.g. nginx: nginx.ingress.kubernetes.io/backend-protocol: "HTTPS").
ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # Session affinity for HA without Redis (ingress-nginx):
    # nginx.ingress.kubernetes.io/affinity: "cookie"
    # nginx.ingress.kubernetes.io/session-cookie-name: "ucm-node"
  host: ucm.local
  tls: []
    # - secretName: ucm-tls
    #   hosts: [ucm.local]
  ## Expose the plain-HTTP protocol port (8080) under /cdp, /ocsp on a separate
  ## host or path for ACME HTTP-01 / CRL / OCSP clients that need cleartext.
  protocolHttp:
    enabled: false
    host: pki.local

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

## Liveness hits /health/live and readiness /health/ready on https://:8443 (UCM serves a self-signed cert; the HTTPS
## scheme tells the kubelet to skip verification).
livenessProbe:
  enabled: true
  initialDelaySeconds: 40
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
## HA only: a container killed and restarted in its pod waits up to 190 s for its
## previous heartbeat to expire before it serves; liveness and readiness start after.
startupProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 30
readinessProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

## The image runs as the non-root user ucm (UID/GID 1000); fsGroup makes the
## data and /etc/ucm volumes writable by it (set fsGroupChangePolicy to Always
## if files inside a volume were written by another user).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
