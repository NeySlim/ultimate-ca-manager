# Docker Compose with HSM support
# SoftHSM tokens persist in a named volume
#
# Usage:
#   docker compose -f docker-compose.hsm.yml up -d
#   docker exec ucm-hsm softhsm2-util --show-slots

services:
  ucm:
    image: neyslim/ultimate-ca-manager:latest
    container_name: ucm-hsm
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8080:8080"   # HTTP — required for CRL/CDP and OCSP public endpoints
    environment:
      # HSM auto-init: creates a default SoftHSM token on first start
      HSM_AUTO_INIT: "true"
      # Provide a fixed PIN (optional — auto-generated if omitted)
      # HSM_PIN: "change-me"
      # Initial admin password (first start only). Unset: generated, read it with
      #   docker compose exec ucm cat /opt/ucm/data/initial-admin-password
      # To choose it, prefer a secret (uncomment the secrets blocks too):
      # UCM_INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/ucm_admin_password
      # Second choice, visible in docker inspect:
      # UCM_INITIAL_ADMIN_PASSWORD: change-me
    # secrets:
    #   - ucm_admin_password
    volumes:
      - ucm-data:/opt/ucm/data
      # master.key, which decrypts every private key in the database (REQUIRED)
      - ucm-config:/etc/ucm
      # SoftHSM tokens live in the data volume since 2.233. This older volume is
      # read once, at the first start of 2.233, to carry its tokens over.
      - ucm-hsm-tokens:/var/lib/softhsm/tokens
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# secrets:
#   ucm_admin_password:
#     file: ./ucm_admin_password.txt   # one line, the password; keep it out of version control

volumes:
  ucm-data:
  ucm-config:
  ucm-hsm-tokens:
